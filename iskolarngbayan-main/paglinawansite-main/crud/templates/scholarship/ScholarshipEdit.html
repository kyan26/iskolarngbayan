{% extends 'layout/base.html' %}
{% block 'title' %}Edit Scholarship{% endblock %}

{% block 'content' %}
{% include 'include/Sidebar.html' %}
{% include 'include/ToastMessage.html' %}

<div class="sm:ml-64 mt-14 p-6 flex flex-col items-center">
    <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-white">Edit Scholarship</h1>
        <p class="text-slate-400 text-sm mt-1">Update scholarship information</p>
    </div>

    <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-6 w-full max-w-2xl">
        <form method="POST">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Scholarship Name</label>
                    <input type="text" name="name" value="{{ scholarship.name }}"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Description</label>
                    <textarea name="description" rows="3"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">{{ scholarship.description }}</textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Amount (₱)</label>
                    <input type="number" name="amount" value="{{ scholarship.amount }}"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Slots Available</label>
                    <input type="number" name="slots" value="{{ scholarship.slots }}"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Required GPA
                        <span class="text-slate-500 text-xs">(scholars above this are auto-rejected)</span>
                    </label>
                    <input type="number" name="required_gpa" step="0.01" min="1.00" max="5.00"
                        value="{{ scholarship.gpa_requirement }}"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Start Date</label>
                    <input type="date" name="start_date" value="{{ scholarship.start_date|date:'Y-m-d' }}"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">End Date</label>
                    <input type="date" name="end_date" value="{{ scholarship.end_date|date:'Y-m-d' }}"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Eligibility Requirements</label>
                    <textarea name="eligibility" rows="3"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">{{ scholarship.eligibility }}</textarea>
                </div>

            </div>

            <div class="flex flex-col gap-2 mt-6">
                <button type="submit" class="bg-[#6366f1] hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition w-full">Update Scholarship</button>
                <a href="/scholarship/list" class="bg-[#334155] hover:bg-slate-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition text-center w-full">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
    input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
        opacity: 0.6;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
        opacity: 1;
    }
</style>
{% endblock %}
