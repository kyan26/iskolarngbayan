{% extends 'layout/base.html' %}
{% block 'title' %}Delete Role{% endblock %}

{% block 'content' %}
{% include 'include/Sidebar.html' %}
{% include 'include/ToastMessage.html' %}

<div class="sm:ml-64 mt-14 p-6 flex flex-col items-center">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">Delete Role</h1>
    </div>

    <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-6 w-full max-w-2xl">
        <p class="text-slate-300 mb-2">Are you sure you want to delete this role?</p>
        <p class="text-white font-bold text-lg mb-6">{{ role.role }}</p>

        <form method="POST">
            {% csrf_token %}
            <div class="flex gap-2">
                <button type="submit" class="bg-red-500 hover:bg-red-400 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Yes, Delete</button>
                <a href="/role/list" class="bg-[#334155] hover:bg-slate-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
