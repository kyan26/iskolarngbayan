{% if messages %}
{% for message in messages %}
<div id="toast-{{ forloop.counter }}"
    class="fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-sm font-medium
    {% if message.tags == 'success' %} bg-green-500 text-white
    {% elif message.tags == 'error' %} bg-red-500 text-white
    {% else %} bg-blue-500 text-white {% endif %}">
    {% if message.tags == 'success' %}
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    {% else %}
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
    {% endif %}
    {{ message }}
</div>
<script>
    setTimeout(() => {
        const toast = document.getElementById('toast-{{ forloop.counter }}');
        if (toast) toast.style.display = 'none';
    }, 3000);
</script>
{% endfor %}
{% endif %}
