{% extends "layout/base.html" %}

{% block 'title' %} Delete Gender Page{% endblock 'title' %}

{% block 'content' %}
{% include "include/Sidebar.html" %}
{% include "include/ToastMessage.html" %}
<div class="sm:ml-64 mt-14 p-6 flex flex-col items-center">
    <form action="/gender/delete/{{ gender.gender_id }}" method="post">
        {% csrf_token %}
        <div class="mx-auto w-full md:w-1/3 mb-2">
            <label for="gender" class="block text-sm font-semibold text-white mb-3 mt-1">Gender</label>
            <input 
                type="text" id="gender" name="gender" class="bg-white mb-2 px-3 py-2.5 border
                border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none
                focus:ring-2 focus:ring-blue-600" name="gemder" id="gender" value="{{ gender.gender }}">
            <div class="flex justify-end">
                <a href="/gender/list" class="bg-white text-sm font-medium text-black px-3 py-2.5 mr-1 rounded-sm shadow-sm cursor-pointer
                hover:bg-gray-100 hover:outline-none">Back</a>
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-sm font-medium text-white
                px-5 py-2.5 rounded-sm shadow-sm cursor-pointer hover:outline-none">Delete Gender</button>
            </div>
        </div>
    </form>
</div>

{% endblock 'content' %}
