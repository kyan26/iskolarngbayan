{% extends 'layout/base.html' %}
{% block 'title' %}Add Grade{% endblock %}

{% block 'content' %}
{% include 'include/Sidebar.html' %}
{% include 'include/ToastMessage.html' %}

<div class="sm:ml-64 mt-14 p-6 flex flex-col items-center">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">Add Grade</h1>
        <p class="text-slate-400 text-sm mt-1">{{ scholar.full_name }}</p>
    </div>

    <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-6 max-w-2xl">
        <form method="POST">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Subject</label>
                    <input type="text" name="subject" placeholder="e.g. Mathematics"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Grade</label>
                    <input type="number" name="grade" step="0.01" min="1.00" max="5.00" placeholder="1.50"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Semester</label>
                    <select name="semester" class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                        <option value="">-- Select Semester --</option>
                        <option value="1st Semester">1st Semester</option>
                        <option value="2nd Semester">2nd Semester</option>
                        <option value="Summer">Summer</option>
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">School Year</label>
                    <input type="text" name="school_year" placeholder="e.g. 2024-2025"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>
            </div>
            <div class="flex gap-2 mt-6">
                <button type="submit" class="bg-[#6366f1] hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Save Grade</button>
                <a href="/scholar/{{ scholar.scholar_id }}/grades" class="bg-[#334155] hover:bg-slate-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
