{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static '/css/output.css' %}">
    <title>Login | iSkolar ng Bayan</title>
    <style> body { background-color: #0f172a; } </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#0f172a]">

    <div class="w-full max-w-md px-6">

        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="bg-[#6366f1] p-3 rounded-xl mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">iSkolar ng Bayan</h1>
            <p class="text-slate-400 text-sm mt-1">Scholarship Management System</p>
        </div>

        <!-- Error Messages -->
        {% if messages %}
        <div class="bg-red-900 border border-red-500 rounded-xl p-4 mb-4">
            {% for message in messages %}
            <p class="text-red-300 text-sm">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Login Card -->
        <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-8">
            <h2 class="text-lg font-semibold text-white mb-6">Sign in to your account</h2>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                    <input type="text" name="username" value="{{ form_data.username|default:'' }}"
                        placeholder="Enter your username" autofocus
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="password"
                            placeholder="••••••••"
                            class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                        <button type="button" onclick="togglePassword()"
                            class="absolute right-3 top-2.5 text-slate-400 hover:text-white text-xs">Show</button>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-[#6366f1] hover:bg-indigo-500 text-white font-medium text-sm py-2.5 rounded-lg transition">
                    Sign In
                </button>
            </form>
        </div>

    </div>

    <script>
        function togglePassword() {
            const field = document.getElementById('password');
            const btn = field.nextElementSibling;
            if (field.type === 'password') {
                field.type = 'text';
                btn.textContent = 'Hide';
            } else {
                field.type = 'password';
                btn.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
