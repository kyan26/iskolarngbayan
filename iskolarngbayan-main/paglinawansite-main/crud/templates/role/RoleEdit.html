{% extends 'layout/base.html' %}
{% block 'title' %}Edit Role{% endblock %}

{% block 'content' %}
{% include 'include/Sidebar.html' %}
{% include 'include/ToastMessage.html' %}

<div class="sm:ml-64 mt-14 p-4 sm:p-6 flex flex-col items-center">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">Edit Role</h1>
        <p class="text-slate-400 text-sm mt-1">Update role information</p>
    </div>

    <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-6 w-full max-w-2xl">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-300 mb-2">Role Name</label>
                <input type="text" name="role" value="{{ role.role }}"
                    class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
            </div>
            <div class="flex gap-2 mt-6">
                <button type="submit" class="bg-[#6366f1] hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Update Role</button>
                <a href="/role/list" class="bg-[#334155] hover:bg-slate-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
