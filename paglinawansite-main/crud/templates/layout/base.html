{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static '/css/output.css' %}">
    <title>{% block 'title' %}{% endblock 'title' %} | iSkolar ng Bayan</title>
    <style>
        body { background-color: #0f172a; }
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 1000px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        #pageContent { display: none; }
    </style>
</head>
<body class="bg-[#0f172a]">

    <!-- SKELETON SCREEN -->
    <div id="skeletonScreen">
        <!-- Skeleton Navbar -->
        <div class="fixed top-0 left-0 right-0 z-50 h-14 bg-[#1e293b] border-b border-[#334155] flex items-center px-6 gap-4">
            <div class="skeleton h-5 w-8 rounded"></div>
            <div class="skeleton h-6 w-48"></div>
            <div class="ml-auto skeleton h-9 w-9 rounded-full"></div>
        </div>
        <!-- Skeleton Sidebar -->
        <div class="fixed top-14 left-0 h-full w-64 bg-[#0f172a] border-r border-[#334155] p-4 flex flex-col gap-6 pt-8">
            {% for i in "123456789" %}
            <div class="skeleton h-4 w-3/4"></div>
            {% endfor %}
        </div>
        <!-- Skeleton Content -->
        <div class="sm:ml-64 mt-14 p-6">
            <div class="flex flex-col gap-4">
                <div class="skeleton h-9 w-1/3 rounded-lg"></div>
                <div class="rounded-lg overflow-hidden border border-[#334155]">
                    <div class="bg-[#6366f1] px-6 py-3 flex gap-6">
                        {% for i in "123456" %}
                        <div class="skeleton h-4 w-1/6 opacity-30"></div>
                        {% endfor %}
                    </div>
                    {% for i in "12345678" %}
                    <div class="flex gap-6 px-6 py-4 border-b border-[#334155] items-center bg-[#1e293b]">
                        <div class="skeleton h-9 w-9 rounded-full flex-shrink-0"></div>
                        <div class="skeleton h-4 w-1/6"></div>
                        <div class="skeleton h-4 w-1/6"></div>
                        <div class="skeleton h-4 w-1/6"></div>
                        <div class="flex gap-2 ml-auto">
                            <div class="skeleton h-8 w-14 rounded"></div>
                            <div class="skeleton h-8 w-14 rounded"></div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <!-- REAL CONTENT -->
    <div id="pageContent">
        {% block 'content' %}{% endblock 'content' %}
    </div>

    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                document.getElementById('skeletonScreen').style.display = 'none';
                document.getElementById('pageContent').style.display = 'block';
            }, 800);
        });
    </script>

    {% block 'scripts' %}{% endblock 'scripts' %}
</body>
</html>
