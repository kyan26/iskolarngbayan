{% extends 'layout/base.html' %}
{% block 'title' %}Add Scholar{% endblock %}

{% block 'content' %}
{% include 'include/Sidebar.html' %}
{% include 'include/ToastMessage.html' %}

<div class="sm:ml-64 mt-14 p-6 flex flex-col items-center">
    <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-white">Add Scholar</h1>
        <p class="text-slate-400 text-sm mt-1">Create a new scholar profile</p>
    </div>

    <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-6 w-full max-w-2xl">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Select User</label>
                    <select name="user_id" id="user_select" onchange="fillName(this)"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                        <option value="">-- Select a Scholar User --</option>
                        {% for user in available_users %}
                            <option value="{{ user.user_id }}" data-name="{{ user.full_name }}">
                                {{ user.full_name }} ({{ user.username }})
                            </option>
                        {% empty %}
                            <option value="" disabled>No available scholar users</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Auto-filled name display -->
                <div class="sm:col-span-2" id="name-display" style="display:none;">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                    <div class="w-full bg-[#0f172a] border border-[#334155] text-slate-400 text-sm rounded-lg px-4 py-2.5" id="name-text"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Phone Number</label>
                    <input type="text" name="phone" placeholder="09XXXXXXXXX"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Address</label>
                    <input type="text" name="address" placeholder="Barangay, City, Province"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">School</label>
                    <input type="text" name="school" placeholder="University name"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Course</label>
                    <input type="text" name="course" placeholder="e.g. BSIT"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Year Level</label>
                    <select name="year_level"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                        <option value="">-- Select Year --</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">GPA</label>
                    <input type="number" name="gpa" step="0.01" min="1.00" max="5.00" placeholder="1.50"
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Photo <span class="text-slate-500">(optional)</span></label>
                    <input type="file" name="photo" accept="image/*"
                        class="w-full bg-[#0f172a] border border-[#334155] text-slate-400 text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                </div>

            </div>

            <div class="flex gap-2 mt-6">
                <button type="submit" class="bg-[#6366f1] hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Save Scholar</button>
                <a href="/scholar/list" class="bg-[#334155] hover:bg-slate-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    function fillName(select) {
        const nameDisplay = document.getElementById('name-display');
        const nameText = document.getElementById('name-text');
        const selected = select.options[select.selectedIndex];
        if (selected.value) {
            nameText.textContent = selected.getAttribute('data-name');
            nameDisplay.style.display = 'block';
        } else {
            nameDisplay.style.display = 'none';
            nameText.textContent = '';
        }
    }
</script>

{% endblock %}
