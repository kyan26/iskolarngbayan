{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static '/css/output.css' %}">
    <title>Login | iSkolar ng Bayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0B1120;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* subtle background glow blobs */
        body::before {
            content: '';
            position: fixed;
            top: -120px; left: -120px;
            width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(79,142,247,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -100px; right: -100px;
            width: 380px; height: 380px;
            background: radial-gradient(circle, rgba(124,92,252,0.10) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        /* ── LOGO ── */
        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4F8EF7, #7C5CFC);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(79,142,247,0.3);
        }
        .logo-icon svg { width: 28px; height: 28px; color: #fff; }
        .logo-title {
            font-size: 22px;
            font-weight: 700;
            color: #F1F5F9;
            letter-spacing: -0.02em;
        }
        .logo-sub {
            font-size: 13px;
            color: #64748B;
            margin-top: 4px;
        }

        /* ── ERROR ── */
        .login-error {
            background: rgba(220,38,38,0.1);
            border: 1px solid rgba(220,38,38,0.3);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .login-error p {
            font-size: 13px;
            color: #FCA5A5;
        }

        /* ── CARD ── */
        .login-card {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
        }

        .login-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #F1F5F9;
            margin-bottom: 24px;
        }

        /* ── FORM ── */
        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94A3B8;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: #0B1120;
            border: 1px solid rgba(255,255,255,0.08);
            color: #F1F5F9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            border-radius: 10px;
            padding: 11px 14px;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        .form-input::placeholder { color: #475569; }
        .form-input:focus {
            border-color: #4F8EF7;
            box-shadow: 0 0 0 3px rgba(79,142,247,0.12);
        }

        .password-wrap { position: relative; }
        .password-wrap .form-input { padding-right: 56px; }

        .toggle-pw {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #475569;
            font-size: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            letter-spacing: 0.03em;
            transition: color 0.15s;
            padding: 4px;
        }
        .toggle-pw:hover { color: #94A3B8; }

        /* ── SUBMIT ── */
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #4F8EF7, #7C5CFC);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.18s, transform 0.18s, box-shadow 0.18s;
            box-shadow: 0 4px 16px rgba(79,142,247,0.25);
        }
        .login-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(79,142,247,0.35);
        }
        .login-btn:active {
            transform: translateY(0);
            opacity: 1;
        }

        /* ── FOOTER NOTE ── */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #334155;
        }
    </style>
</head>
<body>

    <div class="login-wrap">

        <!-- Logo -->
        <div class="login-logo">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
            </div>
            <h1 class="logo-title">iSkolar ng Bayan</h1>
            <p class="logo-sub">Scholarship Management System</p>
        </div>

        <!-- Error Messages -->
        {% if messages %}
        <div class="login-error">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Card -->
        <div class="login-card">
            <p class="login-card-title">Sign in to your account</p>

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username"
                        value="{{ form_data.username|default:'' }}"
                        placeholder="Enter your username"
                        autofocus
                        class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-wrap">
                        <input type="password" name="password" id="passwordField"
                            placeholder="••••••••"
                            class="form-input">
                        <button type="button" class="toggle-pw" onclick="togglePassword()" id="toggleBtn">Show</button>
                    </div>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>

        <p class="login-footer">© 2026 iSkolar ng Bayan. All rights reserved.</p>
    </div>

    <script>
        function togglePassword() {
            const field = document.getElementById('passwordField');
            const btn = document.getElementById('toggleBtn');
            if (field.type === 'password') {
                field.type = 'text';
                btn.textContent = 'Hide';
            } else {
                field.type = 'password';
                btn.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
