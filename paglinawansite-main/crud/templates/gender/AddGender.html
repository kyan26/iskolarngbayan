{% extends "layout/base.html" %}

{% block 'title' %} Add Gender Page{% endblock 'title' %}

{% block 'content' %}
{% include "include/Sidebar.html" %}
{% include "include/ToastMessage.html" %}

<div class="sm:ml-64 mt-14 p-6 flex flex-col items-center">
    <form action="/gender/add" method="post">
        {% csrf_token %}
        <div class="mx-auto w-full md:w-1/3 mb-2">
            <label for="gender" class="block text-sm font-semibold text-white mb-3 mt-1">Gender</label>
            <input 
                type="text" id="gender" name="gender" class="bg-white mb-2 px-3 py-2.5 border
                border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none
                focus:ring-2 focus:ring-blue-600" name="gender" id="gender">
            <div class="flex justify-end">
                <button 
                type="submit"
                class="bg-green-600 hover:bg-green-700 text-sm font-medium text-white
                px-5 py-2.5 rounded-sm shadow-sm cursor-pointer">Save Gender</button>
            </div>
        </div>
    </form>
</div>

{% endblock 'content' %}
