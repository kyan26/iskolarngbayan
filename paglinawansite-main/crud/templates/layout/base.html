{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="{% static 'css/iskolar.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
    <title>{% block 'title' %}{% endblock 'title' %} | iSkolar ng Bayan</title>
    <script>
        (function () {
            const saved = localStorage.getItem('iskolar-theme');
            if (saved === 'light') document.body.classList.add('light-mode');
        })();
    </script>
</head>
<body>

    <!-- SKELETON -->
    <div id="skeletonScreen">
        <div class="fixed top-0 left-0 right-0 z-50 h-14 flex items-center px-6 gap-4"
            style="background:var(--navbar-bg);border-bottom:1px solid var(--border)">
            <div class="skeleton h-5 w-8 rounded"></div>
            <div class="skeleton h-6 w-48"></div>
            <div class="ml-auto skeleton h-9 w-9 rounded-full"></div>
        </div>
        <div class="fixed top-14 left-0 h-full w-64 p-4 flex flex-col gap-5 pt-8"
            style="background:var(--sidebar-bg);border-right:1px solid var(--border)">
            {% for i in "123456789" %}
            <div class="skeleton h-4 w-3/4"></div>
            {% endfor %}
        </div>
        <div class="sm:ml-64 mt-14 p-6 flex flex-col gap-4">
            <div class="skeleton h-9 w-1/3 rounded-lg"></div>
            <div class="rounded-lg overflow-hidden" style="border:1px solid var(--border)">
                <div class="px-6 py-3 flex gap-6" style="background:#4F46E5">
                    {% for i in "123456" %}
                    <div class="skeleton h-4 w-1/6 opacity-30"></div>
                    {% endfor %}
                </div>
                {% for i in "12345678" %}
                <div class="flex gap-6 px-6 py-4 items-center"
                    style="border-bottom:1px solid var(--border);background:var(--table-row)">
                    <div class="skeleton h-9 w-9 rounded-full flex-shrink-0"></div>
                    <div class="skeleton h-4 w-1/6"></div>
                    <div class="skeleton h-4 w-1/6"></div>
                    <div class="flex gap-2 ml-auto">
                        <div class="skeleton h-8 w-14 rounded"></div>
                        <div class="skeleton h-8 w-14 rounded"></div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- REAL CONTENT -->
    <div id="pageContent">
        {% block 'content' %}{% endblock 'content' %}
    </div>

    <script src="{% static 'js/iskolar.js' %}"></script>
    {% block 'scripts' %}{% endblock 'scripts' %}
</body>
</html>
