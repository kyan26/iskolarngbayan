{% extends 'layout/base.html' %}
{% block 'title' %}Add Application{% endblock %}

{% block 'content' %}
{% include 'include/Sidebar.html' %}
{% include 'include/ToastMessage.html' %}

<div class="sm:ml-64 mt-14 p-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">Add Application</h1>
        <p class="text-slate-400 text-sm mt-1">Submit a new scholarship application</p>
    </div>

    <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-6 max-w-2xl">
        <form method="POST">
            {% csrf_token %}
            <div class="grid grid-cols-1 gap-4">

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Scholar</label>
                    <select name="scholar" class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                        <option value="">-- Select Scholar --</option>
                        {% for scholar in scholars %}
                        <option value="{{ scholar.scholar_id }}">{{ scholar.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Scholarship</label>
                    <select name="scholarship" class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                        <option value="">-- Select Scholarship --</option>
                        {% for scholarship in scholarships %}
                        <option value="{{ scholarship.scholarship_id }}">{{ scholarship.name }} (₱{{ scholarship.amount }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Remarks <span class="text-slate-500">(optional)</span></label>
                    <textarea name="remarks" rows="3" placeholder="Additional notes..."
                        class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]"></textarea>
                </div>

            </div>

            <div class="flex gap-2 mt-6">
                <button type="submit" class="bg-[#6366f1] hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Submit Application</button>
                <a href="/application/list" class="bg-[#334155] hover:bg-slate-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
