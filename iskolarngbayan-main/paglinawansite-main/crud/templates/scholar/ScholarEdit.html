{% extends 'layout/base.html' %}
{% block 'title' %}Edit Scholar{% endblock %}

{% block 'content' %}
{% include 'include/Sidebar.html' %}
{% include 'include/ToastMessage.html' %}

<div class="sm:ml-64 mt-14 p-4 sm:p-6 flex flex-col items-center">
    <div class="w-full max-w-2xl">

        <div class="mb-6">
            <h1 class="text-xl sm:text-2xl font-bold text-white">Edit Scholar</h1>
            <p class="text-slate-400 text-sm mt-1">Update scholar profile</p>
        </div>

        <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-4 sm:p-6 w-full">
            <form method="POST">
                {% csrf_token %}
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                        <input type="text" name="full_name" value="{{ scholar.full_name }}"
                            class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-slate-300 mb-2">Address</label>
                        <input type="text" name="address" value="{{ scholar.address }}"
                            class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">School</label>
                        <input type="text" name="school" value="{{ scholar.school }}"
                            class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Course</label>
                        <input type="text" name="course" value="{{ scholar.course }}"
                            class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Year Level</label>
                        <select name="year_level"
                            class="w-full bg-[#0f172a] border border-[#334155] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#6366f1]">
                            <option value="">-- Select Year --</option>
                            <option value="1st Year" {% if scholar.year_level == "1st Year" %}selected{% endif %}>1st Year</option>
                            <option value="2nd Year" {% if scholar.year_level == "2nd Year" %}selected{% endif %}>2nd Year</option>
                            <option value="3rd Year" {% if scholar.year_level == "3rd Year" %}selected{% endif %}>3rd Year</option>
                            <option value="4th Year" {% if scholar.year_level == "4th Year" %}selected{% endif %}>4th Year</option>
                        </select>
                    </div>

                    <!-- GPA — read-only -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">
                            GPA
                            <span class="text-slate-500 text-xs ml-1">(auto-calculated)</span>
                        </label>
                        <div class="w-full bg-[#0f172a] border border-[#1e3a5f] text-sm rounded-lg px-4 py-2.5 flex items-center gap-2 cursor-not-allowed">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-indigo-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                            </svg>
                            <span class="text-white font-medium">{{ scholar.gpa }}</span>
                        </div>
                        <input type="hidden" name="gpa" value="{{ scholar.gpa }}">
                    </div>

                </div>

                <div class="flex flex-col sm:flex-row gap-2 mt-6">
                    <button type="submit"
                        class="bg-[#6366f1] hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition text-center">
                        Update Scholar
                    </button>
                    <a href="/scholar/list"
                        class="bg-[#334155] hover:bg-slate-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition text-center">
                        Cancel
                    </a>
                </div>
            </form>
        </div>

    </div>
</div>
{% endblock %}
